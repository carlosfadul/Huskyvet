<!-- src/app/pages/sucursal-dashboard/sucursal-dashboard.component.html -->

<mat-sidenav-container class="dashboard-container">
  <mat-sidenav mode="side" opened class="sidenav" fixedInViewport="false">
    <div class="sidenav-header">
      <div class="sidenav-logo">
        <mat-icon class="sidenav-logo-icon">pets</mat-icon>
      </div>
      <div class="sidenav-brand">
        <span class="brand-name">Huskyvet</span>
        <span class="brand-sub">Panel de Sucursal</span>
      </div>
    </div>

    <mat-nav-list class="nav-list">

      <a
        mat-list-item
        [routerLink]="['/veterinaria', veterinariaId, 'sucursal', sucursalId, 'dashboard', 'clientes']"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Clientes</span>
      </a>

      <a
        mat-list-item
        [routerLink]="['/veterinaria', veterinariaId, 'sucursal', sucursalId, 'dashboard', 'mascotas']"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>pets</mat-icon>
        <span matListItemTitle>Mascotas</span>
      </a>

      <a
        mat-list-item
        [routerLink]="['/veterinaria', veterinariaId, 'sucursal', sucursalId, 'dashboard', 'nomina']"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>payments</mat-icon>
        <span matListItemTitle>Nomina</span>
      </a>

      <a
        mat-list-item
        [routerLink]="['/veterinaria', veterinariaId, 'sucursal', sucursalId, 'dashboard', 'ventas']"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>point_of_sale</mat-icon>
        <span matListItemTitle>Ventas</span>
      </a>

      <a
        mat-list-item
        [routerLink]="['/veterinaria', veterinariaId, 'sucursal', sucursalId, 'dashboard', 'pedidos']"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>shopping_cart</mat-icon>
        <span matListItemTitle>Pedidos</span>
      </a>

      <div class="nav-divider"></div>

      <a
        mat-list-item
        [routerLink]="['/veterinaria', veterinariaId, 'sucursal', sucursalId, 'dashboard', 'configuracion']"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>settings</mat-icon>
        <span matListItemTitle>Configuracion</span>
      </a>

    </mat-nav-list>

    <div class="sidenav-footer">
      <a
        mat-list-item
        [routerLink]="['/veterinarias']"
        class="back-link"
      >
        <mat-icon matListItemIcon>arrow_back</mat-icon>
        <span matListItemTitle>Volver al inicio</span>
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
